version: 2

models:
  - name: mart_top_channels_per_client
    description: "Top 3 channels per client by revenue influenced over the last 90 days."
    columns:
      - name: client_id
        tests:
          - not_null
      - name: channel
        tests:
          - not_null
      - name: total_revenue_influenced
        description: "Sum of revenue influenced for all conversion events in the 90-day window"
        tests:
          - not_null
      - name: channel_rank
        description: "1 = highest revenue channel for that client"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]

  - name: mart_account_engagement_trend
    description: "Monthly event counts per client and account with month-over-month delta."
    columns:
      - name: client_id
        tests:
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: event_month
        description: "First day of the calendar month"
        tests:
          - not_null
      - name: total_events
        description: "Distinct events in this month"
        tests:
          - not_null
      - name: prev_month_events
        description: "Distinct events in the prior month. NULL if first month."
      - name: mom_change
        description: "total_events minus prev_month_events. NULL prev_month treated as 0."

  - name: mart_efficient_campaigns
    description: "Campaigns outperforming their channel peers on cost per meeting booked."
    columns:
      - name: client_id
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null
      - name: campaign_name
        tests:
          - not_null
      - name: channel
        tests:
          - not_null
      - name: budget
        description: "Planned campaign budget in USD"
      - name: meetings_booked
        description: "Number of meeting_booked events for this campaign"
      - name: cost_per_meeting
        description: "budget / meetings_booked for this campaign"
      - name: avg_cost_per_meeting_for_channel
        description: "Average cost per meeting across all campaigns in the same channel"

  - name: mart_top_accounts
    description: "Top 10 accounts per client by total all-time revenue influenced."
    columns:
      - name: client_id
        tests:
          - not_null
      - name: account_rank
        description: "1 = highest revenue account for that client"
        tests:
          - not_null
      - name: account_id
        tests:
          - not_null
      - name: total_revenue_influenced
        tests:
          - not_null

  - name: mart_budget_vs_actuals
    description: "Budget vs actual spend per campaign from the agency Parquet file."
    columns:
      - name: client_id
        tests:
          - not_null
      - name: campaign_id
        tests:
          - not_null
      - name: budget
        description: "Planned campaign budget in USD"
      - name: total_actual_spend
        description: "Total actual spend from the agency. 0 if no spend data available."
      - name: variance
        description: "budget - total_actual_spend. Positive = under budget."
      - name: variance_pct
        description: "variance as a % of budget"
      - name: status
        description: "over_budget or under_budget"
        tests:
          - accepted_values:
              values: ['over_budget', 'under_budget']